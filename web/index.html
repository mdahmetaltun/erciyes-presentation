<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sağlıkta Yapay Zeka Uygulamaları · Prof. Dr. Ahmet Altun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<canvas id="bg"></canvas>

<div id="viewport">
  <div id="world">
    <svg id="route" width="1" height="1"></svg>
    <div id="ghosts"></div>
    <div id="frames"></div>
  </div>
</div>
<div id="vignette"></div>

<header id="hud-top">
  <div id="section">
    <svg id="badge" viewBox="0 0 100 100"><path id="badge-path" d="M50 6 L88 28 L88 72 L50 94 L12 72 L12 28 Z"/></svg>
    <div><small id="sec-no">00</small><b id="sec-name">Açılış</b></div>
  </div>
  <div class="tools">
    <button id="btn-sound" title="Sesi Kapat (M)"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
    <button id="btn-over" title="Genel bakış (O)"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg></button>
    <button id="btn-full" title="Tam ekran (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>

<footer id="hud-bottom">
  <div id="progress"></div>
  <div class="nav">
    <button id="btn-prev" title="Geri (←)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="counter">01 / 01</span>
    <button id="btn-next" title="İleri (→ / Boşluk)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</footer>

<div id="help">← → / Boşluk ile ilerle · M: ses · O: genel bakış · F: tam ekran · Fare tekerleği de çalışır</div>

<script src="js/gsap.min.js"></script>
<script src="js/SplitText.min.js"></script>
<script src="js/MorphSVGPlugin.min.js"></script>
<script src="js/CustomEase.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
